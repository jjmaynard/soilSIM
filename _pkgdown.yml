url: https://jjmaynard.github.io/soilSIM/

# soilSIM/docs/ already holds hand-written developer/architecture reference docs
# (.Rbuildignore'd) - build pkgdown's site into a different directory so it never
# writes generated HTML into that folder.
destination: pkgdown_site

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, functions, reference, articles, news]
    right: [search, github]
  components:
    intro:
      text: Get Started
      menu:
      - text: "Tabular Monte Carlo simulation from SSURGO"
        href: articles/getting-started-monte-carlo.html
      - text: "Profile, component & depth simulation"
        href: articles/profile-depth-simulation.html
      - text: "Available water storage via Van Genuchten / ROSETTA"
        href: articles/aws-van-genuchten.html
      - text: "Multi-source raster fusion: SSURGO x SOLUS100"
        href: articles/raster-fusion-ssurgo-solus.html
      - text: "Per-pixel fused ensemble & available water capacity"
        href: articles/raster-fusion-perpixel-awc.html
    functions:
      text: Function-Level Guides
      menu:
      - text: "Data acquisition, cleaning & infilling"
        href: articles/data-acquisition-processing.html
      - text: "Statistics & diagnostics"
        href: articles/statistics-diagnostics.html
      - text: "Distribution fitting & correlations"
        href: articles/distribution-fitting-correlations.html
      - text: "GP depth modeling & multivariate adjustment"
        href: articles/gp-modeling-multivariate-adjustment.html
      - text: "Bayesian updating (scalar)"
        href: articles/bayesian-updating.html
      - text: "Raster-native fitting & fusion internals"
        href: articles/raster-native-fitting-fusion.html
    articles:
      text: Architecture
      menu:
      - text: "Overview"
        href: articles/architecture-overview.html
      - text: "Data Acquisition & Processing"
        href: articles/architecture-data-acquisition-processing.html
      - text: "Statistics & Diagnostics"
        href: articles/architecture-statistics-diagnostics.html
      - text: "Distribution Fitting & Correlations"
        href: articles/architecture-distribution-fitting-correlations.html
      - text: "Monte Carlo Simulation"
        href: articles/architecture-monte-carlo-simulation.html
      - text: "GP Modeling & Multivariate Adjustment"
        href: articles/architecture-gp-modeling-multivariate-adjustment.html
      - text: "Profile, Component & Depth Simulation"
        href: articles/architecture-profile-component-depth-simulation.html
      - text: "AWS / Van Genuchten Modeling"
        href: articles/architecture-aws-van-genuchten-modeling.html
      - text: "Bayesian Updating"
        href: articles/architecture-bayesian-updating.html
      - text: "Multi-Source Raster Fusion Pipeline"
        href: articles/architecture-multi-source-raster-fusion-pipeline.html
      - text: "Utilities"
        href: articles/architecture-utilities.html

